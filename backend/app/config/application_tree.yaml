    target_prompt_layer: world
    target_node_field: description
    target_edge_type: RULE_ERA_MARK
    transform: map_to_era_stage_enum
    priority: 3
  - source_field: RED.forbidden
    target_prompt_layer: world
    target_node_field: description
    target_edge_type: RULE_CONTENT_GATE
    transform: map_to_forbidden_tags
    priority: 4
  - source_field: WST.climate_zone
    target_prompt_layer: world
    target_node_field: description
    target_edge_type: RULE_CLIMATE_ZONE
    transform: map_to_climate_enum
