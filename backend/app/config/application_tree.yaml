# 约束应用逻辑树（断点C）— 6维约束 × 6生成层 = 36条注入映射
# 字段（逐字对照层级图断点C节）:
#   source_field:       从约束哪个字段读（DIM.field，field 来自 dimension.py 各 Output 模型）
#   target_prompt_layer: 注入 PromptBuilder 哪一层（8层: world/location/camera/subject/
#                        gameplay/interaction/material/lighting）
#   target_node_field:  影响什么节点字段（必须是 GraphNode/GraphEdge 真实字段，
#                       knowledge_graph.py: description/visual_description/level/... ）
#   target_edge_type:   触发什么拓扑边（语义边标签，T-F 建边时落为 CROSS 边）
#   transform:          用什么转换函数
#   priority:           在该层内的注入优先级（1 最高，层内不重复）
#
# 注: 层级图示例值 "Geography.vertical_layer" 不是 GraphNode 真实字段（MUST NOT 虚构），
#     语义下沉到 transform=map_to_vertical_layer_enum，注入目标用真实字段 description。

world:
  - source_field: LAW.world_structure
    target_prompt_layer: world
    target_node_field: description
    target_edge_type: RULE_SHAPES_GEO
    transform: map_to_vertical_layer_enum
    priority: 1
  - source_field: SOC.political_type
    target_prompt_layer: world
    target_node_field: description
    target_edge_type: RULE_CULTURE_ORDER
    transform: map_to_political_enum
    priority: 2
