# 标签+枚举词典 - 断点A数据层（裁决A转正版本）
# ============================================
# 来源: 层级图L105-130 attested值 + 2026-08-21用户裁决A转正的扩展值（原proposed）
#
# 结构说明：
# - values: 合并后的枚举值列表（attested + proposed，已转正）
# - 2026-08-21 用户裁决A批准：所有 proposed 值转正为正式枚举值
#
# 层级图中明确示例：
# world_structure: FLOATING_ISLANDS / SPHERE / TREE(+"/...")
# gravity: HIGH
# conservation: TRUE
# ============================================

