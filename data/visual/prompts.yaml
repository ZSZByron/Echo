# Echo Image Generation Prompt Templates
# Version 2.0 — Template-based format
#
# Template variables used by PromptBuilder:
#   {world_prefix}  — setting, era, mood, lighting style
#   {location}      — environment, architecture, atmosphere
#   {camera}        — composition, angle, framing (from camera_templates)
#   {subject}       — object description (from subject_description or lod_subjects)
#   {gameplay}      — gameplay function hint (optional)
#   {material}      — physical surfaces, textures, tech overlays
#   {lighting}      — lighting style and atmosphere
#
# PromptBuilder flow: {world_prefix} {location} {camera} {subject} {material} {lighting}
# LOD support: Each object can define lod_subjects.{far|mid|near} for distance-specific descriptions

version: "2.0"

# =============================================================================
# Template definitions — reusable prompt fragments
# =============================================================================
templates:
  world_prefix: "cyberpunk ancient civilization, post-human Greek mythology, dark decaying grandeur, synthwave lighting"
  location: "ancient marble temple ruins, broken columns, holographic technology overlays, mist and darkness"
  camera:
    bg: "wide cinematic composition, slight overhead angle, empty foreground, game environment, atmospheric perspective, 16:9"
    obj: "single object, centered, isolated, transparent background, game asset, front view, high detail, studio lighting"
  material: "weathered gray marble, oxidized dark bronze, cyan neon circuits, quantum glow"
  lighting: "synthwave lighting, cyberpunk concept art, dark fantasy, volumetric fog, cinematic"
  negative_default: "people, characters, text, logo, watermark, modern buildings, cars, low quality, blurry, distorted, extra limbs, warm light, yellow light, cheerful"

# =============================================================================
# Camera templates for LOD shots
# =============================================================================
camera_templates:
  far: "wide shot, establishing view, atmospheric perspective, object at distance, environmental context, 16:9 game background"
  mid: "medium shot, clear subject detail, some environmental context, balanced composition, game asset, centered"
  near: "close-up shot, maximum detail, shallow depth of field, texture focus, interactive view, high detail, centered"

# =============================================================================
# Legacy segments (kept for backward compatibility)
# =============================================================================
segments:
  world_prefix: "cyberpunk ancient civilization, post-human Greek mythology, dark decaying grandeur, synthwave lighting"
  space_prefix: "ancient marble temple ruins, broken columns, holographic technology overlays, mist and darkness"
  camera_bg: "wide cinematic composition, slight overhead angle, empty foreground, game environment, atmospheric perspective, 16:9"
  camera_obj: "single object, centered, isolated, transparent background, game asset, front view, high detail, studio lighting"
  material_prefix: "weathered gray marble, oxidized dark bronze, cyan neon circuits, quantum glow"
  negative_default: "people, characters, text, logo, watermark, modern buildings, cars, low quality, blurry, distorted, extra limbs, warm light, yellow light, cheerful"

# Shared style descriptors appended to every prompt
style_words: "synthwave lighting, cyberpunk concept art, dark fantasy, volumetric fog, cinematic"

# =============================================================================
# Background assets
# =============================================================================
background:
  temple_ruins_bg:
    name: "Temple Ruins Background"
    subject_description: "temple interior wide shot, foreground: fallen priest in lower left clutching data-core, midground: holographic altar with rippling light surface in center right, background: ancient locked door with glowing runes at far end, neon circuit pillars framing sides, atmospheric perspective from near to far, volumetric fog layers, depth progression from detailed foreground to mysterious background"
    # Template layers used for full prompt generation
    template_layers: ["world_prefix", "location", "camera.bg", "subject_description", "material", "lighting"]
    # Full prompt kept for backward compatibility (marked as template-generated)
    full_prompt: "cyberpunk ancient civilization, post-human Greek mythology, dark decaying grandeur, synthwave lighting, ancient marble temple ruins, broken columns, holographic technology overlays, mist and darkness, temple interior wide shot, foreground: fallen priest in lower left clutching data-core, midground: holographic altar with rippling light surface in center right, background: ancient locked door with glowing runes at far end, neon circuit pillars framing sides, atmospheric perspective from near to far, volumetric fog layers, depth progression from detailed foreground to mysterious background, wide cinematic composition, slight overhead angle, game environment, atmospheric perspective, 16:9, weathered gray marble, oxidized dark bronze, cyan neon circuits, quantum glow, synthwave lighting, cyberpunk concept art, dark fantasy, volumetric fog, cinematic"
    negative: "people, characters, text, logo, watermark, modern buildings, cars, low quality, blurry, distorted, extra limbs, warm light, yellow light, cheerful"
    size: "1920x1080"

