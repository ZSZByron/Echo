# Echo UGC — production stack (single-node, no user system yet)
# Usage: docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
# Ports overridable via env: WEB_PORT (default 80), API_PORT (default 8000)

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env.production
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
