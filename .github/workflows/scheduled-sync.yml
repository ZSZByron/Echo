name: Scheduled Sync

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-check:
    name: Check Sync Status
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Check local vs remote
      run: |
        echo "Checking sync status..."
        git fetch origin
        LOCAL=$(git rev-parse main)
        REMOTE=$(git rev-parse origin/main)
        if [ "$LOCAL" = "$REMOTE" ]; then
          echo "✅ Repository is in sync"
        else
          echo "⚠️ Repository is out of sync"
          echo "Local: $LOCAL"
          echo "Remote: $REMOTE"
          exit 1
        fi

  backup-check:
    name: Verify Backup Integrity
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check critical files
      run: |
        CRITICAL_FILES=(
          "backend/app/main.py"
          "frontend/src/App.tsx"
          "README.md"
          ".github/workflows/ci-cd.yml"
        )
        
        for file in "${CRITICAL_FILES[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file exists"
          else
            echo "❌ $file is missing!"
            exit 1
          fi
        done

  dependency-update:
    name: Update Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Check backend dependencies
      run: |
        cd backend
        pip install pip-audit
        pip-audit
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Check frontend dependencies
      run: |
        cd frontend
        npm audit --audit-level=moderate

  status-report:
    name: Generate Status Report
    runs-on: ubuntu-latest
    needs: [sync-check, backup-check, dependency-update]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate report
      run: |
        echo "# Sync Status Report" > status.md
        echo "Generated: $(date)" >> status.md
        echo "" >> status.md
        echo "## Repository Status" >> status.md
        echo "- Sync: ✅ Up to date" >> status.md
        echo "- Backup: ✅ All critical files present" >> status.md
        echo "- Dependencies: ✅ No critical vulnerabilities" >> status.md
        cat status.md
    
    - name: Upload status report
      uses: actions/upload-artifact@v3
      with:
        name: sync-status-report
        path: status.md
        retention-days: 30